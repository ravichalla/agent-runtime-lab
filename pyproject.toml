[project]
name = "agent-runtime-lab"
version = "0.1.0"
description = "Lab: lease-based, crash-recoverable agent session runtime (DynamoDB + SQS FIFO + asyncio TaskGroups)"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["moto[dynamodb,sqs]>=5.0", "pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
